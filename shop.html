<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko - Gumi Eohakwon Sukabumi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-12">
  <div class="max-w-7xl mx-auto px-5">
    <h1 class="text-4xl font-bold text-center mb-12">Gumi Eohakwon Shop</h1>
    
    <div class="grid md:grid-cols-3 gap-8">
      <!-- Buku -->
      <div class="bg-white rounded-3xl overflow-hidden shadow">
        <img src="https://images.unsplash.com/photo-1544947958-8d4f4e8b5e3f" class="w-full h-64 object-cover">
        <div class="p-6">
          <h3 class="font-bold">Buku Bahasa Korea EPS TOPIK</h3>
          <p class="text-2xl font-bold text-indigo-600 mt-2">Rp 125.000</p>
          <button onclick="alert('Redirect ke pembayaran')" class="mt-6 w-full py-4 bg-black text-white rounded-2xl">Beli Buku</button>
        </div>
      </div>

      <!-- T-Shirt -->
      <div class="bg-white rounded-3xl overflow-hidden shadow">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" class="w-full h-64 object-cover">
        <div class="p-6">
          <h3 class="font-bold">T-Shirt Gumi Eohakwon</h3>
          <p class="text-2xl font-bold text-indigo-600 mt-2">Rp 89.000</p>
          <button onclick="alert('Redirect ke pembayaran')" class="mt-6 w-full py-4 bg-black text-white rounded-2xl">Beli T-Shirt</button>
        </div>
      </div>
    </div>
  </div>

</html>
