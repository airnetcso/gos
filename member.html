<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Area | Gumi Eohakwon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F5EFE6; 
      color: #1E293B;
    }
    .rounded-modern { border-radius: 1rem !important; }

    #sidebar { width: 280px; }

    nav button, nav a {
      font-size: 0.75rem !important;
      letter-spacing: 0.025em;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #E4DCCF;
      transition: all 0.2s;
    }
    .list-row:hover { background-color: #E4DCCF; }

    .watched {
      background-color: #F1F5F9 !important;
      opacity: 0.7;
    }
    .watched .title-text {
      color: #94A3B8 !important;
      text-decoration: line-through;
    }
    .watched i { color: #CBD5E1 !important; }

    .video-container {
      background: black;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .avatar-container {
      position: relative;
      width: 48px;
      height: 48px;
      cursor: pointer;
    }
    .avatar-image {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #F5EFE6;
      background-color: #F5EFE6;
    }
    .avatar-edit-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      color: white;
      font-size: 10px;
    }
    .avatar-container:hover .avatar-edit-overlay { opacity: 1; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #F5EFE6; }
    ::-webkit-scrollbar-thumb { background: #D6C7AE; border-radius: 10px; }
  </style>
</head>
<body>

  <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="updateAvatar(event)">

  <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-[#1E293B] p-6">
    <div class="max-w-md w-full bg-white rounded-modern shadow-2xl p-10 text-center border-b-8 border-[#AE944F]">
      <img src="https://github.com/airnetcso/gos/blob/main/LOGO_HITAM_PUTIH-removebg-preview.png?raw=true" 
           alt="Gumi Logo" class="w-24 h-24 mx-auto mb-6 object-contain">
      <h1 class="text-3xl font-bold text-slate-900 tracking-tighter">Member Area</h1>
      <p class="text-slate-500 font-semibold text-sm mt-2">Gumi Eohakwon Sukabumi</p>
      
      <div class="mt-10 space-y-4">
        <input type="password" id="accessCode" placeholder="KODE AKSES" class="w-full px-8 py-6 bg-slate-50 border border-slate-200 rounded-modern focus:border-[#AE944F] outline-none text-center text-lg font-semibold tracking-widest">
        <button onclick="checkAccess()" class="w-full py-6 bg-[#1E293B] hover:bg-[#AE944F] text-white rounded-modern font-bold text-sm uppercase tracking-widest transition-all">MASUK</button>
      </div>
    </div>
  </div>

  <div id="memberContent" class="hidden flex min-h-screen">
    <aside id="sidebar" class="bg-[#1E293B] text-white fixed h-full z-50 overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center gap-3 mb-10">
          <div class="avatar-container" onclick="document.getElementById('avatarInput').click()">
            <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=D6C7AE&color=1E293B" class="avatar-image" alt="User">
            <div class="avatar-edit-overlay"><i class="fas fa-camera"></i></div>
          </div>
          <div class="leading-tight">
            <span id="displayUserName" class="font-bold text-lg tracking-tight text-white">Member</span>
            <p class="text-[#D6C7AE] text-[10px] font-bold uppercase">Premium Member</p>
          </div>
        </div>

        <nav class="space-y-0.5">
          <button onclick="showDashboard()" class="w-full flex items-center gap-4 px-5 py-3.5 font-semibold uppercase text-left rounded-modern hover:bg-slate-800 transition-colors">
            <i class="fas fa-info-circle text-sky-400"></i> Dashboard
          </button>

          <div class="my-2 border-t border-white/5"></div>

          <button onclick="showClassSection('dasar')" class="w-full flex items-center gap-4 px-5 py-3.5 font-semibold uppercase text-slate-300 hover:text-white text-left">
            <i class="fas fa-book-reader text-emerald-500"></i> Kelas Dasar
          </button>
          <button onclick="showClassSection('menengah')" class="w-full flex items-center gap-4 px-5 py-3.5 font-semibold uppercase text-slate-300 hover:text-white text-left">
            <i class="fas fa-book-reader text-orange-500"></i> Kelas Menengah
          </button>
          <button onclick="showClassSection('lanjutan')" class="w-full flex items-center gap-4 px-5 py-3.5 font-semibold uppercase text-slate-300 hover:text-white text-left">
            <i class="fas fa-book-reader text-blue-500"></i> Kelas Lanjutan
          </button>

          <div class="my-2 border-t border-white/5"></div>

          <button onclick="showModuleSection('materi')" class="w-full flex items-center gap-4 px-5 py-3.5 font-semibold uppercase text-slate-300 hover:text-white text-left">
            <i class="fas fa-book-reader text-blue-400"></i> Module Materi
          </button>
          <button onclick="showModuleSection('listening')" class="w-full flex items-center gap-4 px-5 py-3.5 font-semibold uppercase text-slate-300 hover:text-white text-left">
            <i class="fas fa-book-reader text-purple-400"></i> Module Listening
          </button>
          <button onclick="showModuleSection('soal')" class="w-full flex items-center gap-4 px-5 py-3.5 font-semibold uppercase text-slate-300 hover:text-white text-left">
            <i class="fas fa-book-reader text-rose-400"></i> Module Soal
          </button>

          <div class="pt-6 border-t border-white/10 mt-6 space-y-1">
            <button onclick="contactWA('konsultasi')" class="w-full flex items-center gap-4 px-5 py-3 font-semibold uppercase text-[#D6C7AE] hover:text-white transition-all">
              <i class="fas fa-info-circle"></i> Konsultasi Admin
            </button>
            <button onclick="contactWA('upgrade')" class="w-full flex items-center gap-4 px-5 py-3 font-semibold uppercase text-[#D6C7AE] hover:text-white transition-all">
              <i class="fas fa-info-circle"></i> Upgrade Kelas
            </button>
            <a href="https://kp2mi.go.id/gtog-korea/pengumuman" target="_blank" class="w-full flex items-center gap-4 px-5 py-3 font-semibold uppercase text-blue-400 hover:text-white transition-colors">
              <i class="fas fa-info-circle"></i> Info GToG Korea
            </a>
          </div>
        </nav>
      </div>
      <button onclick="logout()" class="mx-6 mb-8 w-[calc(100%-3rem)] py-4 bg-white/5 hover:bg-rose-500/20 rounded-modern text-rose-400 font-bold text-xs uppercase transition-all">LOGOUT</button>
    </aside>

    <main class="flex-1 ml-[280px] p-6 md:p-12">
      <div id="content-main">
        <div id="dashboard-info" class="p-10 bg-white border-l-8 border-[#AE944F] rounded-r-2xl shadow-sm text-center">
           <p id="koreanQuote" class="font-bold text-slate-800 mb-4 text-3xl leading-snug"></p>
           <p id="indoQuote" class="text-[#8D7B68] italic text-xl font-medium"></p>
           <div class="mt-8 pt-6 border-t border-slate-100">
             <p class="text-slate-400 text-sm font-bold uppercase tracking-widest">Silahkan pilih materi di sidebar untuk mulai belajar</p>
           </div>
        </div>

        <div id="list-container" class="hidden">
          <h2 id="list-title" class="text-2xl font-bold text-slate-900 mb-6 flex items-center gap-3 border-b-2 border-[#D6C7AE] pb-4 uppercase tracking-tighter"></h2>
          <div id="list-items" class="bg-transparent"></div>
        </div>
      </div>

      <div id="content-video" class="hidden">
        <div class="flex justify-between items-center mb-6">
          <button onclick="closeVideo()" class="text-[#8D7B68] hover:text-slate-900 flex items-center gap-2 font-semibold text-lg">
            <i class="fas fa-arrow-left"></i> Kembali ke Daftar
          </button>
          <span class="text-xs font-bold text-rose-500 animate-pulse uppercase tracking-widest"><i class="fas fa-circle"></i> Sedang Belajar</span>
        </div>
        <div class="video-container aspect-video">
          <iframe id="videoPlayer" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay"></iframe>
        </div>
      </div>
    </main>
  </div>

  <script>
    // --- KONFIGURASI QUOTES (GANTI DISINI) ---
    const koreanQuoteText = "오늘 걷지 않으면 내일 뛰어야 한다.";
    const indoQuoteText = '"Jika kamu tidak berjalan hari ini, kamu harus berlari besok."';

    const accessDatabase = {
      "AWEWE21": { name: "Asep", owned: ["Dasar"] },
      "AMIRA22": { name: "Amira", owned: ["Dasar", "Menengah", "Lanjutan"] }
    };

    const classData = {
      dasar: { 
        title: "Kelas Dasar", 
        icon: "fas fa-book-reader text-emerald-500", 
        items: [
          "1. Pengenalan Huruf Korea", "2. Vokal Dasar", "3. Konsonan Dasar", 
          "4. Vokal Rangkap", "5. Konsonan Rangkap", "6. Penggabungan Huruf", 
          "7. Aturan Pelafalan", "8. Chagi Soge", "9. Kalimat Kopula", 
          "10. Kalimat Preposisi", "11. Bilangan Sino", "12. Bilangan Asli", 
          "13. Pembentukan Kalimat"
        ] 
      },
      menengah: { 
        title: "Kelas Menengah", 
        icon: "fas fa-book-reader text-orange-500", 
        items: [
          "1. Kalimat Pernyataan Formal", "2. Kalimat Pertanyaan Formal", 
          "3. Kalimat Ajakan", "4. Kalimat Perintah", "5. Kalimat Informal", 
          "6. Kalimat Negatif", "7. Kalimat Larangan", "8. Kalimat Tenses Sedang", 
          "9. Kalimat Tenses Ingin", "10. Kalimat Tenses Akan", "11. Kalimat Tenses Lampau"
        ] 
      },
      lanjutan: { 
        title: "Kelas Lanjutan", 
        icon: "fas fa-book-reader text-blue-500", 
        items: [
          "1. Akhiran Bisa / Tidak Bisa", "2. Akhiran Pernah / Tidak Pernah", 
          "3. Akhiran Boleh / Tidak Boleh", "4. Akhiran Harus", "5. Akhiran Penawaran", 
          "6. Akhiran Akan 2", "7. Kata Sambung Dan, Dengan", 
          "8. Kata Sambung Dan, Kemudian", "9. Kata Sambung Kalau, Jika"
        ] 
      }
    };

    const moduleData = {
      materi: { 
        title: "Module Materi", 
        icon: "fas fa-book-reader text-blue-400", 
        files: [
          "Textbook HRDK 2024 Bab 1 - 30", "Textbook HRDK 2024 Bab 31 - 60",
          "Textbook HRDK 2015 Bab 1 - 30", "Textbook HRDK 2015 Bab 31 - 60",
          "Module Dasar Gumi Eohakwon", "Kumpulan Kosa Kata",
          "Kumpulan Kosa Kata (Lawan Kata)", "Kumpulan Kosa Kata (Persamaan Kata)",
          "Kumpulan Kosa Kata (Yang Berkaitan)", "Bahasa Korea Terpadu 1",
          "Bahasa Korea Terpadu 2", "Bahasa Korea Terpadu 3",
          "Bahasa Korea Terpadu 4", "Bahasa Korea Terpadu 5", "Bahasa Korea Terpadu 6"
        ] 
      },
      listening: { 
        title: "Module Listening", 
        icon: "fas fa-book-reader text-purple-400", 
        files: [
          "Audio Listening Textbook HRDK 2024 Bab 1 - 30",
          "Audio Listening Textbook HRDK 2024 Bab 31 - 60",
          "Visual Listening 1", "Visual Listening 2", "Visual Listening 3",
          "Visual Listening 4", "Visual Listening 5"
        ] 
      },
      soal: { title: "Module Soal", icon: "fas fa-book-reader text-rose-400", files: ["Simulasi TOPIK 1", "Tryout Akbar Sukabumi"] }
    };

    const videoUrl = "https://drive.google.com/file/d/1KspUnWD-wzu4L9LiCMYf7--ksIvMPwl9/preview";
    const pdfUrl = "https://drive.google.com/file/d/1yMPXsFCrRS0kKXUTRXpazx5NoP6yBaO6/view?usp=sharing";

    let currentUser = null;
    let currentCategory = null;
    let watchedItems = JSON.parse(localStorage.getItem('gumi_history')) || [];

    // Tampilkan Quotes saat halaman dimuat
    document.getElementById('koreanQuote').innerText = koreanQuoteText;
    document.getElementById('indoQuote').innerText = indoQuoteText;

    function updateAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Image = e.target.result;
          document.getElementById('userAvatar').src = base64Image;
          localStorage.setItem('gumi_avatar', base64Image);
        };
        reader.readAsDataURL(file);
      }
    }

    function checkAccess() {
      const code = document.getElementById('accessCode').value.trim().toUpperCase();
      const user = accessDatabase[code];
      if (user) {
        currentUser = user;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('memberContent').classList.remove('hidden');
        document.getElementById('displayUserName').innerText = user.name;
        
        const savedAvatar = localStorage.getItem('gumi_avatar');
        if (savedAvatar) {
          document.getElementById('userAvatar').src = savedAvatar;
        } else {
          document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${user.name}&background=D6C7AE&color=1E293B`;
        }
      } else { alert("KODE AKSES SALAH!"); }
    }

    function contactWA(type) {
      const phoneNumber = "628385551800";
      let message = "";
      if (type === 'upgrade') {
        message = "Halo Admin Gumi Eohakwon, saya ingin melakukan upgrade paket kelas belajar saya.";
      } else if (type === 'konsultasi') {
        message = "Halo Admin Gumi Eohakwon, saya ingin berkonsultasi mengenai pembelajaran bahasa Korea.";
      }
      const waLink = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
      window.open(waLink, '_blank');
    }

    function showClassSection(type) {
      resetView();
      currentCategory = type;
      const data = classData[type];
      const hasAccess = type === 'dasar' || currentUser.owned.includes(type.charAt(0).toUpperCase() + type.slice(1));
      document.getElementById('list-title').innerHTML = `<i class="${data.icon}"></i> ${data.title}`;
      let html = '';
      data.items.forEach((item, index) => {
        const key = `vid_${type}_${index}`;
        const isWatched = watchedItems.includes(key);
        html += `
          <div class="list-row cursor-pointer ${isWatched ? 'watched' : ''}" onclick="${hasAccess ? `playVideo('${key}')` : ''}">
            <div class="flex items-center gap-3">
              <i class="fas ${hasAccess ? 'fa-play-circle text-emerald-500' : 'fa-lock text-slate-400'}"></i>
              <span class="font-semibold title-text text-sm">${item}</span>
            </div>
            <span class="text-[10px] font-bold ${!hasAccess ? 'text-slate-400' : (isWatched ? 'text-slate-400' : 'text-emerald-600 bg-emerald-100')} px-2 py-1 rounded uppercase">
              ${!hasAccess ? 'Terkunci' : (isWatched ? 'Selesai' : 'Buka')}
            </span>
          </div>`;
      });
      document.getElementById('list-items').innerHTML = html;
      document.getElementById('list-container').classList.remove('hidden');
      document.getElementById('dashboard-info').classList.add('hidden');
    }

    function showModuleSection(type) {
      resetView();
      currentCategory = type;
      const data = moduleData[type];
      document.getElementById('list-title').innerHTML = `<i class="${data.icon}"></i> ${data.title}`;
      let html = '';
      data.files.forEach((file, index) => {
        const key = `doc_${type}_${index}`;
        const isWatched = watchedItems.includes(key);
        html += `
          <div class="list-row ${isWatched ? 'watched' : ''}">
            <div class="flex items-center gap-3">
              <i class="fas fa-file-alt text-slate-500"></i>
              <span class="font-semibold title-text text-sm">${file}</span>
            </div>
            <a href="${pdfUrl}" target="_blank" onclick="markWatched('${key}')" class="text-[10px] font-black text-[#8D7B68] bg-[#D6C7AE]/40 px-3 py-1.5 rounded-lg">BUKA</a>
          </div>`;
      });
      document.getElementById('list-items').innerHTML = html;
      document.getElementById('list-container').classList.remove('hidden');
      document.getElementById('dashboard-info').classList.add('hidden');
    }

    function playVideo(key) {
      document.getElementById('content-main').classList.add('hidden');
      document.getElementById('content-video').classList.remove('hidden');
      document.getElementById('videoPlayer').src = videoUrl;
      markWatched(key);
    }

    function markWatched(key) {
      if (!watchedItems.includes(key)) {
        watchedItems.push(key);
        localStorage.setItem('gumi_history', JSON.stringify(watchedItems));
      }
    }

    function closeVideo() {
      document.getElementById('videoPlayer').src = "";
      document.getElementById('content-video').classList.add('hidden');
      document.getElementById('content-main').classList.remove('hidden');
      if (currentCategory) {
        if (classData[currentCategory]) showClassSection(currentCategory);
        else showModuleSection(currentCategory);
      }
    }

    function showDashboard() {
      resetView();
      document.getElementById('dashboard-info').classList.remove('hidden');
      document.getElementById('list-container').classList.add('hidden');
    }

    function resetView() {
      document.getElementById('content-video').classList.add('hidden');
      document.getElementById('content-main').classList.remove('hidden');
      document.getElementById('videoPlayer').src = "";
    }

    function logout() { window.location.reload(); }
  </script>
</body>
</html>
