<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Siswa | Gumi Eohakwon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0F172A; font-family: 'Plus Jakarta Sans', sans-serif; }
    .bg-krem { background-color: #FDFBF0; }
    .rounded-form { border-radius: 2.5rem !important; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="max-w-md w-full bg-krem rounded-form shadow-2xl overflow-hidden border-b-8 border-amber-600 p-10 text-center animate-fade">
    <div class="w-20 h-20 mx-auto bg-[#0F172A] rounded-2xl flex items-center justify-center text-white text-4xl font-black mb-8 shadow-xl shadow-navy/20">가</div>
    <h1 class="text-3xl font-black text-[#0F172A] uppercase tracking-tighter mb-2">Formulir Baru</h1>
    <p class="text-[10px] font-bold uppercase tracking-widest text-amber-600 mb-10 italic">Gumi Eohakwon Sukabumi</p>
    
    <form id="registrationForm" class="space-y-6 text-left">
      <div>
        <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 tracking-widest ml-4 italic">Nama Lengkap Siswa</label>
        <input type="text" id="studentName" required placeholder="NAMA ANDA" class="w-full px-8 py-5 bg-white border-2 border-slate-100 rounded-2xl focus:border-amber-500 outline-none font-black text-navy uppercase text-xs transition-all">
      </div>
      <div>
        <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 tracking-widest ml-4 italic">Pilih Program Kursus</label>
        <select id="courseLevel" required class="w-full px-8 py-5 bg-white border-2 border-slate-100 rounded-2xl focus:border-amber-500 outline-none font-black text-navy uppercase text-xs">
          <option value="" disabled selected>-- PILIH PAKET --</option>
          <option value="ONLINE VIDEO">ONLINE VIDEO</option>
          <option value="ONLINE LIVE">ONLINE LIVE</option>
          <option value="REGULER OFFLINE">REGULER OFFLINE</option>
          <option value="KELAS KARYAWAN">KELAS KARYAWAN</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-[#0F172A] text-white py-6 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-amber-600 transition-all shadow-xl active:scale-95">Kirim Ke WhatsApp</button>
      <a href="index.html" class="block text-center mt-6 text-[9px] font-black text-navy uppercase hover:underline italic">Kembali ke Beranda</a>
    </form>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nama = document.getElementById('studentName').value;
      const paket = document.getElementById('courseLevel').value;
      const msg = `Halo Admin Gumi, saya *${nama}* ingin daftar paket *${paket}*. Mohon info pembayarannya.`;
      window.open(`https://wa.me/628385551800?text=${encodeURIComponent(msg)}`, '_blank');
    });
  </script>
</body>
</html>
