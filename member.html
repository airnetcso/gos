<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Area | Gumi Eohakwon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    
    * { font-style: normal !important; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FDFBF0;
      color: #1E293B;
    }
    .bg-navy { background-color: #1E293B; }
    .rounded-modern { border-radius: 1.5rem !important; }

    .submenu-container {
      max-height: 0;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .submenu-container.open {
      max-height: 800px;
    }

    .lesson-item {
      transition: all 0.2s;
    }
    .lesson-item:hover {
      background-color: #334155;
      color: white;
    }
    .locked {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-navy p-6">
    <div class="max-w-md w-full bg-white rounded-modern shadow-2xl p-10 text-center border-b-8 border-amber-600">
      <div class="w-20 h-20 mx-auto bg-navy rounded-2xl flex items-center justify-center text-white text-4xl font-black mb-8">가</div>
      <h1 class="text-3xl font-black text-navy tracking-tighter">Member Area</h1>
      <p class="text-slate-500 font-bold text-sm mt-2">Gumi Eohakwon Sukabumi</p>
      
      <div class="mt-10 space-y-4">
        <input type="password" id="accessCode" placeholder="MASUKKAN KODE AKSES" 
               class="w-full px-8 py-6 bg-slate-50 border border-slate-200 rounded-modern focus:border-amber-500 outline-none text-center text-lg font-bold tracking-widest">
        <button onclick="checkAccess()" 
                class="w-full py-6 bg-navy text-white rounded-modern font-black text-sm uppercase tracking-widest hover:bg-amber-600 transition-all">
          MASUK KE DASHBOARD
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="memberContent" class="hidden flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-navy text-white fixed h-full z-50 overflow-y-auto">
      <div class="p-6">
        <div class="flex items-center gap-3 mb-12">
          <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-navy text-2xl font-black">가</div>
          <div>
            <span class="font-black text-xl tracking-tighter">Gumi Area</span>
            <p class="text-amber-500 text-xs font-bold">PREMIUM SYSTEM</p>
          </div>
        </div>

        <nav class="space-y-1">
          <button onclick="showContent('dashboard')" 
                  class="sidebar-active w-full flex items-center gap-4 px-5 py-4 font-bold text-sm uppercase tracking-widest text-left rounded-modern">
            <i class="fas fa-th-large"></i> Overview
          </button>

          <!-- Kelas Dasar -->
          <div>
            <button onclick="toggleSub('submenu-dasar', 'chevron-dasar')" 
                    class="w-full flex items-center justify-between px-5 py-4 font-bold text-sm uppercase text-slate-300 hover:text-white">
              <div class="flex items-center gap-4"><i class="fas fa-book"></i> Kelas Dasar</div>
              <i id="chevron-dasar" class="fas fa-chevron-right"></i>
            </button>
            <div id="submenu-dasar" class="submenu-container ml-6 space-y-1"></div>
          </div>

          <!-- Kelas Menengah -->
          <div>
            <button onclick="toggleSub('submenu-menengah', 'chevron-menengah')" 
                    class="w-full flex items-center justify-between px-5 py-4 font-bold text-sm uppercase text-slate-300 hover:text-white">
              <div class="flex items-center gap-4"><i class="fas fa-book"></i> Kelas Menengah</div>
              <i id="chevron-menengah" class="fas fa-chevron-right"></i>
            </button>
            <div id="submenu-menengah" class="submenu-container ml-6 space-y-1"></div>
          </div>

          <!-- Kelas Lanjutan -->
          <div>
            <button onclick="toggleSub('submenu-lanjutan', 'chevron-lanjutan')" 
                    class="w-full flex items-center justify-between px-5 py-4 font-bold text-sm uppercase text-slate-300 hover:text-white">
              <div class="flex items-center gap-4"><i class="fas fa-book"></i> Kelas Lanjutan</div>
              <i id="chevron-lanjutan" class="fas fa-chevron-right"></i>
            </button>
            <div id="submenu-lanjutan" class="submenu-container ml-6 space-y-1"></div>
          </div>

          <!-- Modul dan Bahan Materi -->
          <div class="pt-4">
            <button onclick="toggleSub('submenu-modul', 'chevron-modul')" 
                    class="w-full flex items-center justify-between px-5 py-4 font-bold text-sm uppercase text-slate-300 hover:text-white">
              <div class="flex items-center gap-4"><i class="fas fa-folder-open"></i> Module Materi</div>
              <i id="chevron-modul" class="fas fa-chevron-right"></i>
            </button>
            <div id="submenu-modul" class="submenu-container ml-6 space-y-1 text-sm"></div>
          </div>

          <!-- Pelengkap -->
          <div class="pt-8 border-t border-white/10 mt-8 space-y-2">
            <button onclick="contactWA('konsultasi')" 
                    class="w-full flex items-center gap-4 px-5 py-4 font-bold text-sm uppercase text-emerald-400 hover:text-white">
              <i class="fas fa-comments"></i> Konsultasi Admin
            </button>
            <button onclick="contactWA('upgrade')" 
                    class="w-full flex items-center gap-4 px-5 py-4 font-bold text-sm uppercase text-amber-400 hover:text-white">
              <i class="fas fa-arrow-up"></i> Upgrade Kelas
            </button>
            <a href="https://kp2mi.go.id/gtog-korea/pengumuman" target="_blank"
               class="w-full flex items-center gap-4 px-5 py-4 font-bold text-sm uppercase text-blue-400 hover:text-white">
              <i class="fas fa-info-circle"></i> Info GToG Korea
            </a>
          </div>
        </nav>
      </div>

      <button onclick="logout()" 
              class="mx-6 mb-8 w-[calc(100%-3rem)] py-4 bg-white/10 hover:bg-white/20 rounded-modern text-rose-400 font-bold text-xs uppercase tracking-widest">
        LOGOUT
      </button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-72 p-8 md:p-12">
      <!-- Dashboard -->
      <div id="content-dashboard">
        <h1 class="text-4xl font-black text-navy">Selamat Datang, <span id="nameDisplay" class="text-amber-600"></span></h1>
        <p class="text-slate-600 mt-3 text-lg">Paket Akses: <span id="statusDisplay" class="font-bold text-navy"></span></p>
      </div>

      <!-- Video Player (Tanpa Border Radius) -->
      <div id="content-video" class="hidden">
        <button onclick="kembaliDashboard()" 
                class="mb-6 text-navy hover:text-amber-600 flex items-center gap-2 font-bold text-lg">
          ← Kembali ke Daftar Materi
        </button>
        <div class="bg-white shadow-2xl overflow-hidden">
          <div class="aspect-video bg-black">
            <iframe id="videoPlayer" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay"></iframe>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const accessDatabase = {
      "AWEWE21": { name: "Asep", owned: ["Dasar"] },
      "SAWER09": { name: "Amir", owned: ["Lanjutan"] },
      "AMIRA22": { name: "Susi", owned: ["Dasar", "Menengah", "Lanjutan"] },
      "BULAN77": { name: "Indra", owned: ["Dasar", "Menengah"] },
      "MALAM22": { name: "Indah", owned: ["Menengah"] }
    };

    const videoSample = "https://drive.google.com/file/d/1KspUnWD-wzu4L9LiCMYf7--ksIvMPwl9/preview";

    const materi = {
      dasar: [
        { id: 1, title: "1. Pengenalan Hangul", url: videoSample },
        { id: 2, title: "2. Pengucapan Dasar", url: videoSample },
        { id: 3, title: "3. Salam dan Perkenalan Diri", url: videoSample }
      ],
      menengah: [
        { id: 4, title: "1. Tata Bahasa Menengah", url: videoSample },
        { id: 5, title: "2. Percakapan Sehari-hari", url: videoSample },
        { id: 6, title: "3. Angka dan Waktu", url: videoSample }
      ],
      lanjutan: [
        { id: 7, title: "1. Kalimat Kompleks", url: videoSample },
        { id: 8, title: "2. Bahasa Formal & Informal", url: videoSample },
        { id: 9, title: "3. Percakapan Bisnis", url: videoSample }
      ]
    };

    let currentUser = null;

    function checkAccess() {
      const code = document.getElementById('accessCode').value.trim().toUpperCase();
      const user = accessDatabase[code];
      
      if (user) {
        currentUser = user;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('memberContent').classList.remove('hidden');
        
        document.getElementById('nameDisplay').innerText = user.name;
        document.getElementById('statusDisplay').innerText = user.owned.join(" & ");
        renderMateri();
      } else {
        alert("KODE AKSES SALAH!");
      }
    }

    function renderMateri() {
      const owned = currentUser.owned;

      // Dasar
      let htmlDasar = '';
      materi.dasar.forEach(item => {
        htmlDasar += `<div onclick="playVideo(${item.id})" class="lesson-item px-5 py-3 cursor-pointer rounded-xl text-slate-300">${item.title}</div>`;
      });
      document.getElementById('submenu-dasar').innerHTML = htmlDasar;

      // Menengah
      let htmlMenengah = '';
      const hasMenengah = owned.includes("Menengah");
      materi.menengah.forEach(item => {
        if (hasMenengah) {
          htmlMenengah += `<div onclick="playVideo(${item.id})" class="lesson-item px-5 py-3 cursor-pointer rounded-xl text-slate-300">${item.title}</div>`;
        } else {
          htmlMenengah += `<div class="lesson-item locked px-5 py-3 rounded-xl text-slate-500 flex items-center gap-2"><i class="fas fa-lock"></i> ${item.title} <span class="text-[10px]">(Terkunci)</span></div>`;
        }
      });
      document.getElementById('submenu-menengah').innerHTML = htmlMenengah;

      // Lanjutan
      let htmlLanjutan = '';
      const hasLanjutan = owned.includes("Lanjutan");
      materi.lanjutan.forEach(item => {
        if (hasLanjutan) {
          htmlLanjutan += `<div onclick="playVideo(${item.id})" class="lesson-item px-5 py-3 cursor-pointer rounded-xl text-slate-300">${item.title}</div>`;
        } else {
          htmlLanjutan += `<div class="lesson-item locked px-5 py-3 rounded-xl text-slate-500 flex items-center gap-2"><i class="fas fa-lock"></i> ${item.title} <span class="text-[10px]">(Terkunci)</span></div>`;
        }
      });
      document.getElementById('submenu-lanjutan').innerHTML = htmlLanjutan;

      // Modul & Bahan Materi (Contoh)
      let htmlModul = `
        <div class="px-5 py-3 text-slate-400 cursor-pointer hover:text-white">• Modul PDF Dasar.pdf</div>
        <div class="px-5 py-3 text-slate-400 cursor-pointer hover:text-white">• Modul PDF Menengah.pdf</div>
        <div class="px-5 py-3 text-slate-400 cursor-pointer hover:text-white">• Latihan Soal EPS-TOPIK.pdf</div>
        <div class="px-5 py-3 text-slate-400 cursor-pointer hover:text-white">• Kosakata Harian.pdf</div>
      `;
      document.getElementById('submenu-modul').innerHTML = htmlModul;
    }

    function playVideo(id) {
      let video = null;
      Object.values(materi).forEach(level => {
        const found = level.find(v => v.id === id);
        if (found) video = found;
      });

      if (video) {
        document.getElementById('content-dashboard').classList.add('hidden');
        document.getElementById('content-video').classList.remove('hidden');
        document.getElementById('videoPlayer').src = video.url;
      }
    }

    function kembaliDashboard() {
      document.getElementById('content-video').classList.add('hidden');
      document.getElementById('content-dashboard').classList.remove('hidden');
      document.getElementById('videoPlayer').src = '';
    }

    function toggleSub(menuId, iconId) {
      const menu = document.getElementById(menuId);
      const icon = document.getElementById(iconId);
      menu.classList.toggle('open');
      icon.style.transform = menu.classList.contains('open') ? 'rotate(90deg)' : 'rotate(0deg)';
    }

    function showContent(page) {
      if (page === 'dashboard') kembaliDashboard();
    }

    function contactWA(type) {
      let message = type === 'konsultasi' 
        ? `Halo Admin Gumi, saya mau konsultasi. Nama saya ${currentUser.name}.` 
        : `Halo Admin Gumi, saya ingin Upgrade Kelas. Nama saya ${currentUser.name}. Paket saat ini: ${currentUser.owned.join(" & ")}`;
      window.open(`https://wa.me/628385551800?text=${encodeURIComponent(message)}`, '_blank');
    }

    function logout() {
      window.location.reload();
    }
  </script>
</body>
</html>
