<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gumi Eohakwon Sukabumi | 구미한구어학원</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { 
      background-color: #F8FAFC; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }
    .rounded-modern { border-radius: 1rem !important; }
    
    .package-card {
      transition: all 0.3s ease;
      height: 100%;
    }
    .package-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }
    .popular::after {
      content: "REKOMENDASI";
      position: absolute;
      top: -12px;
      right: 20px;
      background: #10b981;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen py-10">

  <div class="max-w-7xl mx-auto px-6">
    <div class="text-center mb-10">
      <img src="https://github.com/airnetcso/gos/blob/main/LOGO_HITAM_PUTIH-removebg-preview.png?raw=true" 
           alt="Gumi Eohakwon Logo" class="w-20 h-20 mx-auto mb-6 object-contain">
      <h1 class="text-4xl font-bold text-slate-900">Gumi Eohakwon Sukabumi</h1>
      <p class="text-slate-600 mt-2">구미한구어학원</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-16" id="packageList">
      </div>

    <div id="registrationFormSection" class="hidden max-w-lg mx-auto bg-white rounded-modern shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-center mb-6 text-slate-900">Formulir Pendaftaran</h2>
      
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-2">Nama Lengkap</label>
          <input type="text" id="studentName" placeholder="Nama lengkap Anda" 
                 class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-modern focus:border-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-2">Paket Dipilih</label>
          <input type="text" id="selectedPackage" readonly 
                 class="w-full px-6 py-4 bg-slate-100 border border-slate-200 rounded-modern font-medium text-slate-700">
        </div>
        <button onclick="submitToWA()" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-6 rounded-modern text-lg transition-all">
          KIRIM KE WHATSAPP
        </button>
      </div>
      <div class="text-center mt-6">
        <button onclick="backToPackages()" class="text-slate-500 hover:text-slate-700">← Kembali ke Pilihan Paket</button>
      </div>
    </div>
  </div>

  <script>
    const packages = [
      {
        name: "Kelas Dasar",
        price: "Rp 149.000",
        popular: false,
        features: ["50+ Video", "Modul PDF", "Akses Selamanya", "Grup WA"]
      },
      {
        name: "Tutorial Lengkap",
        price: "Rp 450.000",
        popular: false,
        features: ["Dasar + Menengah + Lanjutan", "Video Full", "Akses Selamanya", "Sertifikat"]
      },
      {
        name: "Online Live Zoom",
        price: "Rp 1.200.000",
        popular: true,
        features: ["Kelas Live Zoom", "Interaksi Guru", "Rekaman", "Sertifikat"]
      },
      {
        name: "Kelas Reguler Offline",
        price: "Rp 4.500.000",
        popular: false,
        features: ["Kelas offline", "3 Bulan Intensif", "Bimbingan Privat", "Job Info"]
      }
    ];

    function renderPackages() {
      const container = document.getElementById('packageList');
      container.innerHTML = '';

      packages.forEach(pkg => {
        const cardHTML = `
          <div class="package-card bg-white rounded-modern shadow-xl p-6 border ${pkg.popular ? 'popular border-emerald-200' : 'border-slate-100'} relative">
            <h3 class="text-xl font-bold text-slate-900 mb-1">${pkg.name}</h3>
            <div class="text-3xl font-bold text-emerald-600 my-5">${pkg.price}</div>
            
            <ul class="space-y-2 mb-8 text-sm text-slate-600">
              ${pkg.features.map(f => `<li class="flex items-start gap-2"><i class="fas fa-check text-emerald-500 mt-0.5"></i>${f}</li>`).join('')}
            </ul>
            
            <button onclick="selectPackage('${pkg.name} - ${pkg.price}')" 
                    class="w-full ${pkg.popular ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-slate-900 hover:bg-emerald-600'} text-white font-bold py-4 rounded-modern transition-all">
              PILIH PAKET
            </button>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    function selectPackage(paket) {
      document.getElementById('selectedPackage').value = paket;
      document.getElementById('packageList').classList.add('hidden');
      document.getElementById('registrationFormSection').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function backToPackages() {
      document.getElementById('packageList').classList.remove('hidden');
      document.getElementById('registrationFormSection').classList.add('hidden');
    }

    function submitToWA() {
      const nama = document.getElementById('studentName').value.trim();
      const paket = document.getElementById('selectedPackage').value;

      if (!nama) return alert("Mohon isi nama lengkap Anda");
      if (!paket) return alert("Mohon pilih paket terlebih dahulu");

      const msg = `Halo Admin Gumi,%0ASaya *${nama}* ingin mendaftar:%0A*${paket}*%0AMohon info pembayaran ya. Terima kasih.`;
      window.open(`https://wa.me/628385551800?text=${msg}`, '_blank');
    }

    window.onload = renderPackages;
  </script>
</body>
</html>
