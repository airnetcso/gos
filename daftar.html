<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Paket Kursus | Gumi Eohakwon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { 
      background-color: #F8FAFC; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }
    .rounded-modern { border-radius: 1rem !important; }
    .package-card {
      transition: all 0.3s ease;
    }
    .package-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }
    .popular::after {
      content: "REKOMENDASI";
      position: absolute;
      top: -12px;
      right: 20px;
      background: #10b981;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen py-12">

  <div class="max-w-6xl mx-auto px-6">
    <div class="text-center mb-12">
      <div class="w-16 h-16 bg-slate-900 rounded-2xl mx-auto flex items-center justify-center text-white text-5xl font-black mb-6">가</div>
      <h1 class="text-4xl font-bold text-slate-900">Pilih Paket Kursus</h1>
      <p class="text-slate-600 mt-2">Gumi Eohakwon Sukabumi</p>
    </div>

    <div class="grid md:grid-cols-2 gap-8 mb-16" id="packageList">
      <!-- Paket akan di-generate oleh JS -->
    </div>

    <!-- Formulir Pendaftaran (muncul setelah memilih paket) -->
    <div id="registrationFormSection" class="hidden max-w-md mx-auto bg-white rounded-modern shadow-2xl p-8 mt-12">
      <h2 class="text-2xl font-bold text-center mb-6">Formulir Pendaftaran</h2>
      
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-2">Nama Lengkap</label>
          <input type="text" id="studentName" placeholder="Nama lengkap Anda" 
                 class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-modern focus:border-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-2">Paket Dipilih</label>
          <input type="text" id="selectedPackage" readonly 
                 class="w-full px-6 py-4 bg-slate-100 border border-slate-200 rounded-modern font-medium text-slate-700">
        </div>
        <button onclick="submitToWA()" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-6 rounded-modern text-lg transition-all">
          KIRIM KE WHATSAPP
        </button>
      </div>
      <div class="text-center mt-6">
        <button onclick="backToPackages()" class="text-slate-500 hover:text-slate-700">← Kembali ke Pilihan Paket</button>
      </div>
    </div>
  </div>

  <script>
    const packages = [
      {
        name: "Kelas Dasar",
        price: "Rp 149.000",
        popular: false,
        features: ["50+ Video Materi", "Modul PDF & Latihan", "Akses Selamanya", "Grup Konsultasi WA"]
      },
      {
        name: "Tutorial Lengkap",
        price: "Rp 450.000",
        popular: false,
        features: ["Materi Dasar + Menengah", "Video Full", "Akses 1 Tahun", "Konsultasi Prioritas", "Sertifikat"]
      },
      {
        name: "Online Live Zoom",
        price: "Rp 1.200.000",
        popular: true,
        features: ["Kelas Live via Zoom", "Interaksi Langsung", "Materi Lengkap", "Rekaman Kelas", "Grup Exclusive"]
      },
      {
        name: "Kelas Reguler Offline",
        price: "Rp 4.500.000",
        popular: false,
        features: ["Kelas Offline Sukabumi", "Durasi 3 Bulan", "Materi Full", "Bimbingan Privat", "Job Placement Info"]
      }
    ];

    function renderPackages() {
      const container = document.getElementById('packageList');
      container.innerHTML = '';

      packages.forEach(pkg => {
        const cardHTML = `
          <div class="package-card bg-white rounded-modern shadow-xl p-8 border ${pkg.popular ? 'popular border-emerald-200' : 'border-slate-100'}">
            <h3 class="text-2xl font-bold text-slate-900 mb-1">${pkg.name}</h3>
            <div class="text-4xl font-bold text-emerald-600 my-6">${pkg.price}</div>
            <ul class="space-y-3 mb-8 text-slate-600">
              ${pkg.features.map(f => `<li class="flex items-start gap-2"><i class="fas fa-check text-emerald-500 mt-1"></i>${f}</li>`).join('')}
            </ul>
            <button onclick="selectPackage('${pkg.name} - ${pkg.price}')" 
                    class="w-full ${pkg.popular ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-slate-900 hover:bg-emerald-600'} text-white font-bold py-5 rounded-modern transition-all">
              PILIH PAKET INI
            </button>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    function selectPackage(paket) {
      document.getElementById('selectedPackage').value = paket;
      document.getElementById('packageList').classList.add('hidden');
      document.getElementById('registrationFormSection').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function backToPackages() {
      document.getElementById('packageList').classList.remove('hidden');
      document.getElementById('registrationFormSection').classList.add('hidden');
    }

    function submitToWA() {
      const nama = document.getElementById('studentName').value.trim();
      const paket = document.getElementById('selectedPackage').value;

      if (!nama) {
        alert("Mohon isi nama lengkap Anda");
        return;
      }

      const msg = `Halo Admin Gumi,%0ASaya *${nama}* ingin mendaftar:%0A*${paket}*%0AMohon info pembayaran dan langkah selanjutnya. Terima kasih.`;
      window.open(`https://wa.me/628385551800?text=${msg}`, '_blank');
    }

    // Load packages
    window.onload = renderPackages;
  </script>
</body>
</html>
